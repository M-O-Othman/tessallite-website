# Server config for the public marketing site (Bug-7582).
#
# This file replaced `RUN sed -i 's/80/8080/g' .../default.conf` in the
# Dockerfile. That substitution rewrote EVERY occurrence of "80" in the stock
# config, not just the listen port, so any future edit to the base image could
# have been silently corrupted. The port is declared here instead.

server {
    listen       8080;
    server_name  localhost;
    root         /usr/share/nginx/html;
    index        index.html index.htm;

    # --- Security headers (Bug-7582) ---
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "interest-cohort=()" always;

    # Content-Security-Policy, matched to what the site actually does:
    #
    #   script-src 'unsafe-inline'  download.html, register.html and the TPC-DS
    #       report carry inline <script> blocks. Removing 'unsafe-inline' here
    #       without first extracting them to files breaks the download page and
    #       the licence registration form outright. Tracked for extraction so
    #       this can be tightened.
    #   connect-src https:  register.html and download.html fetch the licence
    #       issuer at a URL supplied at publish time via config.js, so the host
    #       is not knowable here. Restricted to https so it cannot be
    #       downgraded to cleartext.
    #   style-src 'unsafe-inline'  the pages use inline style attributes.
    #
    # frame-ancestors / base-uri / form-action / object-src are the parts that
    # bind regardless, and they are the reason this header is worth shipping
    # even while script-src stays permissive.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # The image is built with `COPY . /usr/share/nginx/html`, which also copies
    # the build and server files into the web root. Do not serve them.
    location ~ ^/(Dockerfile|nginx-default\.conf|README\.md)$ {
        return 404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
