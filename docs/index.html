<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Docs — Tessallite</title>
    <meta name="description" content="Tessallite documentation entry page. Continue to the public help and installation documentation.">
    <meta http-equiv="refresh" content="0; url=../help/index.html">
    <link rel="canonical" href="../help/index.html">
    <link rel="icon" type="image/png" href="../assets/logos/png/favicon.png">
    <link rel="stylesheet" href="../css/brand.css">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .docs-redirect {
            min-height: calc(100vh - 120px);
            display: flex;
            align-items: center;
            background: linear-gradient(180deg, var(--white) 0%, var(--mint) 100%);
            border-bottom: 1px solid var(--slate-border);
        }

        .docs-redirect-box {
            max-width: 760px;
        }

        .docs-redirect-box p {
            color: rgba(51, 51, 51, .88);
            font-size: 18px;
            line-height: 1.65;
            margin: 18px 0 28px;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="container header-container">
            <a href="../index.html" class="logo">
                <img src="../assets/logos/png/logo-primary-horizontal.png" alt="Tessallite" height="80">
            </a>
        </div>
    </header>
    <main class="docs-redirect">
        <div class="container">
            <div class="docs-redirect-box">
                <p class="section-eyebrow">Documentation</p>
                <h1 class="hero-title">Opening Tessallite docs.</h1>
                <p>If the documentation does not open automatically, continue to the public help index.</p>
                <a href="../help/index.html" class="button button-primary">Open documentation</a>
            </div>
        </div>
    </main>
</body>
</html>
